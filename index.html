<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Interactive knowledge graph for Data Challenges in UK Rail" />
    <meta name="theme-color" content="#050b16" />
    <title>Data Challenges | UK Rail</title>
    <style>
     *{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  padding:24px;
  font-family:"Aptos","Segoe UI Variable Display","Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
  background:
    radial-gradient(circle at top right, rgba(28,166,221,.14), transparent 28%),
    linear-gradient(135deg, #030812, #0a2237 58%, #0b3048);
}
:root{
  --kg-bg-start:#050b16;
  --kg-bg-end:#0a2d44;
  --kg-surface:#0d1730;
  --kg-surface-strong:#101d39;
  --kg-surface-soft:#172542;
  --kg-border:#0f4f73;
  --kg-border-soft:rgba(71,144,190,.24);
  --kg-text:#f4f7fb;
  --kg-text-muted:#a5b4c8;
  --kg-text-soft:#7fb7d8;
  --kg-accent:#1ca6dd;
  --kg-accent-strong:#2597c7;
  --kg-shadow:0 24px 60px rgba(0,0,0,.35);
}
.kg-shell{
  display:flex;
  flex-direction:column;
  min-height:calc(100vh - 48px);
  min-height:calc(100dvh - 48px);
  height:calc(100vh - 48px);
  height:calc(100dvh - 48px);
  width:min(100%,1400px);
  margin:0 auto;
  color:var(--kg-text);
  background:
    radial-gradient(circle at top right, rgba(28,166,221,.16), transparent 34%),
    radial-gradient(circle at 18% 20%, rgba(8,22,48,.78), transparent 38%),
    linear-gradient(135deg, var(--kg-bg-start), var(--kg-bg-end));
  border:1px solid rgba(18,82,121,.45);
  border-radius:24px;
  box-shadow:var(--kg-shadow);
  overflow:hidden;
}
.kg-header{display:flex;gap:6px;padding:14px 16px;border-bottom:1px solid var(--kg-border-soft);flex-wrap:wrap;align-items:center;background:rgba(8,16,33,.38);backdrop-filter:blur(12px)}
.kg-tab{padding:6px 12px;border-radius:999px;font-size:12px;cursor:pointer;border:1px solid var(--kg-border-soft);background:rgba(21,36,64,.72);color:var(--kg-text-muted);transition:all 0.15s}
.kg-tab:hover{background:rgba(28,166,221,.14);color:var(--kg-text)}
.kg-tab.active{font-weight:600}
.kg-tab[data-filter=all].active{background:linear-gradient(90deg,var(--kg-accent),var(--kg-accent-strong));color:#041321;border-color:transparent;box-shadow:0 8px 22px rgba(28,166,221,.28)}
.kg-action{margin-left:auto;padding:6px 12px;border-radius:999px;font-size:12px;cursor:pointer;border:1px solid var(--kg-border-soft);background:rgba(21,36,64,.72);color:var(--kg-text);transition:all .15s;font-weight:600}
.kg-action:hover,.kg-action.active{background:linear-gradient(90deg,var(--kg-accent),var(--kg-accent-strong));color:#041321;border-color:transparent;box-shadow:0 8px 22px rgba(28,166,221,.28)}
.kg-body{display:flex;flex:1;min-height:0}
.kg-canvas{flex:1;min-height:0;position:relative;overflow:hidden;cursor:grab;background:transparent}
.kg-canvas:active{cursor:grabbing}
.kg-panel{width:320px;min-height:0;border-left:1px solid var(--kg-border-soft);padding:18px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,rgba(13,23,48,.94),rgba(7,15,31,.96))}
.panel-empty{color:var(--kg-text-muted);font-size:13px;text-align:center;margin-top:40px;line-height:1.6}
.panel-badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:99px;display:inline-block;margin-bottom:2px}
.panel-title{font-size:14px;font-weight:600;color:var(--kg-text);line-height:1.4}
.panel-sublabel{font-size:10px;color:var(--kg-text-muted);margin-top:-4px}
.panel-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--kg-text-soft);margin-top:6px}
.panel-body{font-size:12px;color:var(--kg-text-muted);line-height:1.7}
.panel-example{background:rgba(19,34,61,.86);border-left:2.5px solid var(--kg-accent);border-radius:0 12px 12px 0;padding:8px 10px;font-size:12px;color:var(--kg-text-muted);line-height:1.6}
.panel-list{display:flex;flex-direction:column;gap:10px}
.panel-card{padding:12px 14px;border-radius:14px;background:rgba(20,36,63,.7);border:1px solid var(--kg-border-soft)}
.panel-card.clickable{cursor:pointer;transition:all .15s}
.panel-card.clickable:hover,.panel-card.active{background:rgba(28,166,221,.14);border-color:rgba(28,166,221,.45);box-shadow:0 10px 22px rgba(0,0,0,.18)}
.panel-card-title{font-size:12px;font-weight:700;color:var(--kg-text);letter-spacing:.03em;margin-bottom:6px}
.panel-table{display:flex;flex-direction:column;gap:8px}
.panel-row{padding:10px 12px;border-radius:12px;background:rgba(20,36,63,.7);border:1px solid var(--kg-border-soft)}
.panel-row.clickable{cursor:pointer;transition:all .15s}
.panel-row.clickable:hover,.panel-row.active{background:rgba(28,166,221,.14);border-color:rgba(28,166,221,.45);box-shadow:0 10px 22px rgba(0,0,0,.18)}
.panel-row-key{font-size:11px;font-weight:700;color:var(--kg-text);margin-bottom:4px}
.panel-row-value{font-size:12px;color:var(--kg-text-muted);line-height:1.55}
.panel-links{display:flex;flex-direction:column;gap:4px}
.plbtn{font-size:12px;padding:7px 10px;border:1px solid var(--kg-border-soft);border-radius:14px;cursor:pointer;background:rgba(20,36,63,.84);color:var(--kg-text-muted);text-align:left;transition:all .12s;display:flex;align-items:center;gap:6px}
.plbtn:hover{background:rgba(28,166,221,.12);color:var(--kg-text);border-color:rgba(28,166,221,.4)}
.ask-btn{margin-top:8px;padding:10px 12px;border-radius:12px;font-size:12px;cursor:pointer;border:1px solid transparent;background:linear-gradient(90deg,var(--kg-accent),var(--kg-accent-strong));color:#041321;width:100%;text-align:center;transition:all .15s;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.ask-btn:hover{filter:brightness(1.04);box-shadow:0 10px 22px rgba(28,166,221,.28)}
svg#graph{width:100%;height:100%}
.node-group{cursor:pointer}
.legend{position:absolute;bottom:12px;left:12px;display:flex;flex-direction:column;gap:4px;background:rgba(13,23,48,.88);border:1px solid var(--kg-border-soft);border-radius:16px;padding:10px 12px;pointer-events:none;backdrop-filter:blur(10px);box-shadow:var(--kg-shadow)}
.lr{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--kg-text-muted)}
.ld{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.zoom-btns{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px}
.zbtn{width:30px;height:30px;border:1px solid var(--kg-border-soft);border-radius:12px;background:rgba(13,23,48,.88);cursor:pointer;font-size:15px;color:var(--kg-text);display:flex;align-items:center;justify-content:center;transition:background .1s}
.zbtn:hover{background:rgba(28,166,221,.14)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    </style>
  </head>
  <body>
    <h2 class="sr-only">Interactive knowledge graph of data challenges in UK rail.</h2>

    <div class="kg-shell">
      <div class="kg-header">
        <span style="font-size:12px;font-weight:500;color:var(--kg-text);margin-right:2px">Filter:</span>
        <button class="kg-tab active" data-filter="all" onclick="setFilter('all',this)">All</button>
        <button class="kg-tab" data-filter="behaviour" onclick="setFilter('behaviour',this)">Behaviours</button>
        <button class="kg-tab" data-filter="commercial" onclick="setFilter('commercial',this)">Commercial</button>
        <button class="kg-tab" data-filter="technical" onclick="setFilter('technical',this)">Technical (core)</button>
        <button class="kg-tab" data-filter="bim" onclick="setFilter('bim',this)">Technical › BIM &amp; CDE</button>
        <button class="kg-tab" data-filter="lifecycle" onclick="setFilter('lifecycle',this)">Technical › Lifecycle</button>
        <button class="kg-tab" data-filter="outcomes" onclick="setFilter('outcomes',this)">Outcomes</button>
        <button class="kg-action" id="statementsBtn" onclick="toggleStatements()">Statements &amp; outcomes</button>
        <button class="kg-action" id="briefingBtn" onclick="toggleBriefing()">NEEP briefing</button>
      </div>
      <div class="kg-body">
        <div class="kg-canvas" id="canvas">
          <svg id="graph"></svg>
          <div class="legend">
            <div class="lr"><div class="ld" style="background:#7F77DD"></div>Behaviours</div>
            <div class="lr"><div class="ld" style="background:#C55367"></div>Commercial</div>
            <div class="lr"><div class="ld" style="background:#1D9E75"></div>Technical (core)</div>
            <div class="lr"><div class="ld" style="background:#378ADD"></div>Technical › BIM &amp; CDE</div>
            <div class="lr"><div class="ld" style="background:#D4537E"></div>Technical › Lifecycle</div>
            <div class="lr"><div class="ld" style="background:#D85A30"></div>Outcomes</div>
          </div>
          <div class="zoom-btns">
            <button class="zbtn" onclick="zoom(1.2)">+</button>
            <button class="zbtn" onclick="zoom(0.83)">−</button>
            <button class="zbtn" onclick="resetView()">⤢</button>
          </div>
        </div>
        <div class="kg-panel" id="panel">
          <div class="panel-empty"><i class="ti ti-hand-click" style="font-size:26px;display:block;margin:0 auto 10px;opacity:.4"></i>Click any node to explore the challenge, examples, and connections.</div>
        </div>
      </div>
    </div>

  </body>
</html>
